<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self' https://docs.google.com; img-src data:; base-uri 'none'; form-action 'none'">
<title>ノート試作品ダウンロード</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f3ef; --card: #fff; --line: #e3e1da; --text: #22211e; --sub: #5d5b55; --accent: #2f5bea; --ok: #2e7d4f; --bad: #c0392b; --warnbg: #fff6e0; --warnline: #e9d38a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --card: #1f1f23; --line: #34343b; --text: #ecebe8; --sub: #b0aea8; --accent: #7c9bff; --ok: #6cc590; --bad: #ff7b6e; --warnbg: #332c14; --warnline: #5c4d1e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.7; padding: 24px 0; }
  main { width: calc(100% - 32px); max-width: 520px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 30px; box-shadow: 0 6px 24px rgba(0, 0, 0, .08); }
  h1 { font-size: 21px; margin: 0 0 6px; }
  p { color: var(--sub); margin: .5em 0; }
  .badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 4px; }
  input { width: 100%; font: inherit; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; font: inherit; font-weight: 700; padding: 12px 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; margin-top: 18px; }
  button:disabled { opacity: .55; cursor: default; }
  #msg { min-height: 1.7em; font-size: 14px; margin-top: 10px; }
  #msg.bad { color: var(--bad); } #msg.ok { color: var(--ok); }
  #done { margin-top: 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; }
  #done a.dl { display: block; text-align: center; font-weight: 700; padding: 11px; border-radius: 10px; background: var(--ok); color: #fff; text-decoration: none; margin: 8px 0; }
  .steps-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin: 14px 0 8px; }
  .steps-head svg { width: 28px; height: 28px; flex: none; border-radius: 7px; }
  #done ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  #done ol b { color: var(--text); }
  .icon-inline { width: 15px; height: 15px; vertical-align: -3px; border-radius: 4px; margin: 0 1px; }
  .sha { margin-top: 14px; font-size: 11.5px; color: var(--sub); }
  .warn { margin-top: 16px; padding: 10px 12px; border: 1px solid var(--warnline); background: var(--warnbg); border-radius: 10px; font-size: 12.5px; }
  code { font-size: 11px; word-break: break-all; }
  small { display: block; color: var(--sub); font-size: 12px; margin-top: 16px; line-height: 1.8; }
</style>
</head>
<body>
<main>
  <span class="badge">試作品（β）</span>
  <h1>ノート試作品 ダウンロード</h1>
  <p id="lead">テストにご協力いただく方は、お名前（呼び方でも可）と、教えてもらった合言葉を入力してください。</p>
  <form id="f" autocomplete="off">
    <label for="user">お名前・呼び方</label>
    <input id="user" type="text" placeholder="例：たなか" autocomplete="off" required maxlength="60">
    <label for="pw">合言葉</label>
    <input id="pw" type="text" placeholder="合言葉" autocomplete="off" autocapitalize="off" spellcheck="false" required maxlength="60">
    <button id="go" type="submit">ダウンロード</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
  <div id="done" hidden></div>
  <div id="stopped" class="warn" hidden>現在、配布を停止しています。しばらくしてから、もう一度お試しください。</div>
  <div class="warn">
    Windows 専用のアプリです（Mac・iPad・スマホでは使えません）。<br>
    使ってみての感想・不具合は、アプリを開いたあと、左下の「フィードバック」から送れます。
  </div>
  <small>
    このページは、テストにご協力いただく少人数の方向けです。リンクを他の方に転送しないでください。<br>
    入力したお名前は、誰がダウンロードしたかの記録として開発者に送られます（合言葉は送信されません）。
  </small>
</main>
<script src="app.js"></script>
</body>
</html>
